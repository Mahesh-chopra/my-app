# Static dashboard deployment on Cloudflare Workers (Pages is now part of Workers).
# Before deploying, set the backend origin in public/index.html:
#   <body data-api-base="https://your-backend.example.com">
# and set CORS_ORIGIN on the backend to your deployed Workers URL.

name = "cloud-android-emulator"
compatibility_date = "2026-11-17"

[assets]
directory = "./public"
